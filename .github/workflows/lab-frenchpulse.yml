name: FrenchPulse UI lab validation

on:
  push:
    branches:
      - lab/frenchpulse-ui
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare lab properties
        run: touch local.properties

      - name: Compile Android debug
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace
