name: FrenchPulse UI lab validation

on:
  push:
    branches:
      - lab/frenchpulse-ui
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile JVM target
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --stacktrace

      - name: Run common tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace
