name: FrenchPulse UI lab validation

on:
  push:
    branches:
      - lab/frenchpulse-ui
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare lab properties
        run: touch local.properties

      - name: Compile Android debug
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload lab APK
        uses: actions/upload-artifact@v4
        with:
          name: frenchpulse-nuvio-lab-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
